/* =====================================================
   RAKSALA HUB
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f7f8;
    color: #15363d;
}


/* =====================================================
   HEADER
===================================================== */

.hub-header {
    background: #ffffff;
    border-bottom: 1px solid #dce7e9;
    position: relative;
    z-index: 100;
}

.hub-header-top {

    width: min(1250px, 92%);

    margin: auto;

    min-height: 95px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 25px;
}

.hub-left-logo {

    width: 170px;

    height: auto;

    display: block;
}

.hub-right-logo {

    width: 70px;

    height: 70px;

    object-fit: contain;
}


/* NAVIGATION */

.hub-nav {

    display: flex;

    justify-content: center;

    align-items: center;

    flex-wrap: wrap;

    border-top: 1px solid #edf1f2;
}

.hub-nav a {

    color: #18363d;

    text-decoration: none;

    padding: 17px 18px;

    font-size: 14px;

    font-weight: 700;

    transition: .2s ease;
}

.hub-nav a:hover {

    color: #078d95;

    background: #f1f8f8;
}

.hub-nav a.active {

    color: #078d95;

    border-bottom: 3px solid #078d95;
}


/* =====================================================
   HERO
===================================================== */

.hub-hero {

    min-height: 430px;

    display: flex;

    align-items: center;

    background-image:

        linear-gradient(
            90deg,
            rgba(3,28,34,.92),
            rgba(3,28,34,.65),
            rgba(3,28,34,.35)
        ),

        url("../assets/images/hero.jpg");

    background-size: cover;

    background-position: center;

    color: white;
}

.hub-hero-content {

    width: min(1150px, 92%);

    margin: auto;

    padding: 80px 0;
}

.hub-label {

    display: inline-block;

    padding: 8px 15px;

    border: 1px solid rgba(255,255,255,.4);

    border-radius: 30px;

    color: #69e2dc;

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 2px;

    margin-bottom: 20px;
}

.hub-hero h1 {

    margin: 0 0 20px;

    font-size: clamp(45px, 7vw, 75px);

    line-height: 1;

    color: white;
}

.hub-hero p {

    max-width: 720px;

    margin: 0;

    color: #d7e7ea;

    line-height: 1.8;

    font-size: 17px;
}


/* =====================================================
   MAIN
===================================================== */

.hub-main {

    width: min(1200px, 92%);

    margin: auto;

    padding: 65px 0 90px;
}


/* =====================================================
   HUB STATUS
===================================================== */

.hub-status {

    background: white;

    border: 1px solid #dce7e9;

    border-radius: 18px;

    padding: 22px 25px;

    display: grid;

    grid-template-columns:
        1.4fr
        1fr
        1fr
        1fr;

    gap: 18px;

    margin-bottom: 60px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.05);
}

    padding: 12px;
