<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | RAKSALA</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* ==============================
           RAKSALA CONTACT PAGE
        ============================== */

        .contact-hero {
            min-height: 430px;
            background:
                linear-gradient(rgba(5, 18, 32, 0.65), rgba(5, 18, 32, 0.75)),
                url("../assets/images/hero.jpg") center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
        }

        .contact-hero-content {
            max-width: 900px;
            padding: 40px 20px;
        }

        .contact-hero-content .small-title {
            font-size: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .contact-hero-content h1 {
            font-size: 52px;
            margin: 0 0 18px;
            font-weight: 700;
        }

        .contact-hero-content p {
            font-size: 18px;
            line-height: 1.7;
            max-width: 720px;
            margin: auto;
        }

        /* Main Contact */

        .contact-section {
            padding: 80px 7%;
            background: #f5f7f9;
        }

        .contact-container {
            max-width: 1200px;
            margin: auto;
        }

        .contact-heading {
            text-align: center;
            margin-bottom: 50px;
        }

        .contact-heading span {
            color: #1677a8;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 14px;
        }

        .contact-heading h2 {
            font-size: 36px;
            margin: 12px 0;
            color: #102a43;
        }

        .contact-heading p {
            max-width: 700px;
            margin: auto;
            color: #64748b;
            line-height: 1.7;
        }

        /* Grid */

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 30px;
            align-items: stretch;
        }

        /* Information Cards */

        .contact-info {
            display: grid;
            gap: 18px;
        }

        .contact-card {
            background: #fff;
            border-radius: 14px;
            padding: 25px;
            display: flex;
            gap: 18px;
            align-items: flex-start;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.07);
            border: 1px solid #e6edf2;
            transition: 0.3s ease;
        }

        .contact-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.12);
        }

        .contact-icon {
            min-width: 52px;
            height: 52px;
            border-radius: 12px;
            background: #e9f5fa;
            color: #1677a8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .contact-card h3 {
            margin: 0 0 7px;
            color: #102a43;
            font-size: 18px;
        }

        .contact-card p {
            margin: 0;
            color: #64748b;
            line-height: 1.6;
            font-size: 14px;
        }

        .contact-card a {
            color: #1677a8;
            text-decoration: none;
        }

        .contact-card a:hover {
            text-decoration: underline;
        }

        /* Form */

        .contact-form-box {
            background: #fff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.07);
            border: 1px solid #e6edf2;
        }

        .contact-form-box h3 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #102a43;
            font-size: 25px;
        }

        .contact-form-box > p {
            color: #64748b;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #334e68;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #d8e1e8;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            background: #fff;
            transition: 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #1677a8;
            box-shadow: 0 0 0 3px rgba(22, 119, 168, 0.10);
        }

        .form-group textarea {
            min-height: 125px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            background: #1677a8;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #0e5d87
